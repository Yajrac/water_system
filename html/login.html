<!doctype html>
<html lang="en" class="theme-teal">
  <head>
    <link rel="icon" type="image/jpeg" href="../assets/images/water_system_logo.jpg" />
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <title>Admin Login — Pio Duran Water Supply</title>
    <script src="../js/shared/api-config.js"></script>
    <script src="../js/shared/api.js"></script>
    <script src="../js/auth/auth.js"></script>
    <script src="../js/shared/theme.js"></script>
    <link rel="stylesheet" href="../css/shared/shared.css" />
    <link rel="stylesheet" href="../css/shared/admin.css" />
    <link rel="stylesheet" href="../css/auth/auth.css" />
    <link rel="stylesheet" href="../css/shared/back-button.css" />
    <link rel="stylesheet" href="../css/shared/modals.css" />
    <link rel="stylesheet" href="../css/shared/responsive-cards.css" />
    <link rel="stylesheet" href="../css/shared/form-controls.css" />
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" />
  </head>
  <body class="auth-page">
    <main class="auth-stage">
      <div class="auth-backdrop" aria-hidden="true">
        <span class="auth-glow auth-glow-one"></span>
        <span class="auth-glow auth-glow-two"></span>
        <div class="auth-waves">
          <svg class="auth-wave auth-wave-back" viewBox="0 0 2880 320" preserveAspectRatio="none">
            <path d="M0 150Q360 80 720 150T1440 150T2160 150T2880 150V320H0Z" />
          </svg>
          <svg class="auth-wave auth-wave-mid" viewBox="0 0 2880 320" preserveAspectRatio="none">
            <path d="M0 210Q360 270 720 210T1440 210T2160 210T2880 210V320H0Z" />
          </svg>
          <svg class="auth-wave auth-wave-front" viewBox="0 0 2880 320" preserveAspectRatio="none">
            <path d="M0 260Q360 225 720 260T1440 260T2160 260T2880 260V320H0Z" />
          </svg>
        </div>
      </div>
      <section class="auth-glass" aria-labelledby="loginTitle">
        <div class="auth-glass-brand">
          <img src="../assets/images/water_system_logo.jpg" alt="PWSS logo" />
          <span><strong>Pio Duran Water Supply System</strong>Admin portal</span>
        </div>
        <h1 id="loginTitle">Sign in</h1>
        <p class="auth-glass-lead">Welcome back. Enter your account details to manage customer records, billing and payments.</p>
        <p id="loginMessage" role="alert" tabindex="-1"></p>
        <form id="loginForm">
          <label
            >Username<span class="auth-input"
              ><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" /></svg
              ><input
              name="username"
              autocomplete="username"
              required
              maxlength="40"
              placeholder="Enter your username"
          /></span></label>
          <label
            >Password<span class="auth-input password-field"
              ><svg class="auth-input-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2" /><path d="M8 10V7a4 4 0 0 1 8 0v3" /></svg
              ><input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
                placeholder="Enter your password" /><button
                id="showPassword"
                type="button"
                aria-controls="password"
                aria-pressed="false"
                aria-label="Show password"
                title="Show password"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
                  <circle cx="12" cy="12" r="3" />
                  <path id="passwordEyeSlash" d="M3 3l18 18" hidden />
                </svg></button></span
          ></label>
          <button class="btn btn-primary auth-submit" type="submit"><span class="auth-submit-spinner" aria-hidden="true" hidden></span><span class="auth-submit-label">Sign in</span></button>
        </form>
        <p class="demo-credentials">
          Authorized personnel only. Contact your administrator for account access.
        </p>
      </section>
      <p class="auth-footnote">Serving Pio Duran, Albay since 2021</p>
    </main>
    <script src="../js/auth/login.js"></script>
  </body>
</html>
